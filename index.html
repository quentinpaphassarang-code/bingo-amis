<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo des Amis</title>
<style>
  :root {
    --color-cream: #F7F0E1;
    --color-black: #111111;
    --color-blue: #1B4DE4;
    --color-orange-text: #C2410C;
    --color-orange-fill: #F97316;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--color-cream);
    color: var(--color-black);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
  }

  .app-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .title-box {
    display: inline-block;
    max-width: 100%;
    padding: 10px 20px;
    background: var(--color-black);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(17,17,17,0.06), 0 2px 6px rgba(17,17,17,0.08);
  }

  .title-box h1 {
    color: var(--color-cream);
  }

  .app-header h1 {
    font-size: clamp(1.25rem, 4vw, 2rem);
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .header-progress {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  #progress {
    font-weight: bold;
    color: var(--color-blue);
  }

  .owner-progress {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .owner-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #FFFFFF;
    border: 2px solid var(--color-black);
    color: var(--color-black);
    font-size: 0.85rem;
    font-weight: bold;
    letter-spacing: 0.01em;
    white-space: nowrap;
    box-shadow: 0 1px 2px rgba(17,17,17,0.06), 0 2px 6px rgba(17,17,17,0.08);
  }

  .owner-badge[data-owner="Quentin"] {
    border-color: var(--color-blue);
    color: var(--color-blue);
  }

  .owner-badge[data-owner="Joséphine"] {
    border-color: var(--color-orange-text);
    color: var(--color-orange-text);
  }

  .owner-badge[data-owner="Himanshu"] {
    border-color: var(--color-black);
    color: var(--color-black);
  }

  .error-banner {
    background: var(--color-orange-text);
    color: var(--color-cream);
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 14px;
    font-weight: bold;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: clamp(3px, 1vw, 10px);
    perspective: 600px;
  }

  .cell {
    position: relative;
    min-width: 0;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: #FFFFFF;
    color: var(--color-black);
    border: 2px solid var(--color-black);
    border-radius: 14px;
    padding: 4px;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(17,17,17,0.06), 0 2px 6px rgba(17,17,17,0.08);
    transition: background-color 0.2s ease, opacity 0.2s ease, transform 0.1s ease, box-shadow 0.1s ease;
  }

  .cell:not(.free):not(:disabled):active {
    transform: scale(0.97);
    box-shadow: 0 1px 1px rgba(17,17,17,0.06);
  }

  .cell:disabled {
    cursor: default;
  }

  .cell.completed:not(.free) .cell-label,
  .cell.completed:not(.free) .cell-emoji {
    opacity: 0.35;
  }

  .x-mark {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .x-bar {
    position: absolute;
    width: 76%;
    height: clamp(6px, 1.6vw, 8px);
    background: #7C3AED;
    border-radius: 999px;
  }

  .x-bar-1 {
    transform: rotate(45deg);
  }

  .x-bar-2 {
    transform: rotate(-45deg);
  }

  .cell.free {
    background: #DCEBFF;
    opacity: 0.9;
    cursor: default;
  }

  .cell.fallback {
    background: #EDEDED;
    color: #777;
    cursor: default;
  }

  .cell:focus-visible {
    outline: 3px solid var(--color-blue);
    outline-offset: 2px;
  }

  .cell-emoji {
    line-height: 1;
  }

  .cell-emoji img.emoji {
    width: clamp(16px, 4.5vw, 32px);
    height: clamp(16px, 4.5vw, 32px);
    display: block;
  }

  .cell-label {
    font-size: clamp(0.5rem, 1.9vw, 0.8rem);
    line-height: 1.15;
    text-align: center;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
  }

  .owner-dot {
    position: absolute;
    top: 2px;
    right: 2px;
    width: clamp(12px, 3.2vw, 16px);
    height: clamp(12px, 3.2vw, 16px);
    border-radius: 50%;
    border: 2px solid var(--color-black);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: bold;
    color: #fff;
  }

  .owner-dot.owner-orange {
    color: var(--color-black);
  }

  .owner-lists {
    margin-top: 32px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 768px) {
    .owner-lists {
      grid-template-columns: 1fr;
    }
  }

  .owner-list {
    background: #FFFFFF;
    border: 2px solid var(--color-black);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(17,17,17,0.06), 0 2px 6px rgba(17,17,17,0.08);
  }

  .owner-list-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .owner-list-name {
    font-weight: bold;
    min-width: 90px;
  }

  .owner-list-bar-track {
    flex: 1 1 120px;
    height: 10px;
    border-radius: 999px;
    background: #EDEDED;
    overflow: hidden;
  }

  .owner-list-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  .owner-list-pct {
    font-weight: bold;
    font-size: 0.9rem;
    min-width: 40px;
    text-align: right;
  }

  .owner-list[data-owner="Quentin"] .owner-list-name,
  .owner-list[data-owner="Quentin"] .owner-list-pct {
    color: var(--color-blue);
  }

  .owner-list[data-owner="Quentin"] .owner-list-bar-fill {
    background: var(--color-blue);
  }

  .owner-list[data-owner="Joséphine"] .owner-list-name,
  .owner-list[data-owner="Joséphine"] .owner-list-pct {
    color: var(--color-orange-text);
  }

  .owner-list[data-owner="Joséphine"] .owner-list-bar-fill {
    background: var(--color-orange-text);
  }

  .owner-list[data-owner="Himanshu"] .owner-list-name,
  .owner-list[data-owner="Himanshu"] .owner-list-pct {
    color: var(--color-black);
  }

  .owner-list[data-owner="Himanshu"] .owner-list-bar-fill {
    background: var(--color-black);
  }

  .owner-list-items {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .owner-task-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.9rem;
    color: var(--color-black);
    cursor: pointer;
  }

  .owner-task-btn:hover {
    background: #F3F3F3;
  }

  .owner-task-btn.completed {
    text-decoration: line-through;
    color: #8A8A8A;
  }

  .owner-task-btn:focus-visible {
    outline: 3px solid var(--color-blue);
    outline-offset: 2px;
  }

  @media (max-width: 600px) {
    .page { padding: 12px; }
    .cell-label { -webkit-line-clamp: 2; }
    .owner-badge { font-size: 0.7rem; padding: 3px 7px; }
    .owner-list { padding: 10px 12px; }
    .owner-list-name { font-size: 0.85rem; min-width: 70px; }
    .owner-task-btn { font-size: 0.8rem; padding: 5px 6px; }
  }

  #celebration {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
  }

  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }

  .firework-particle {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }

  .celebration-banner {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--color-black);
    color: var(--color-cream);
    padding: 14px 22px;
    border-radius: 14px;
    font-weight: bold;
    font-size: 1.1rem;
  }

  .gate-overlay {
    position: fixed;
    inset: 0;
    background: var(--color-cream);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .gate-box {
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 1px 2px rgba(17,17,17,0.06), 0 2px 6px rgba(17,17,17,0.08);
  }

  .gate-box .title-box {
    margin-bottom: 10px;
  }

  .gate-box h1 {
    font-size: clamp(1.25rem, 5vw, 1.8rem);
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .gate-notice {
    font-size: 0.85rem;
    color: #555;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .gate-box label {
    display: block;
    text-align: left;
    font-weight: bold;
    margin-bottom: 6px;
  }

  #passInput {
    width: 100%;
    padding: 10px;
    border: 2px solid var(--color-black);
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 1rem;
    box-shadow: 0 1px 2px rgba(17,17,17,0.06), 0 2px 6px rgba(17,17,17,0.08);
  }

  .gate-subtitle {
    text-align: left;
    font-weight: bold;
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .gate-names {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .name-btn {
    flex: 1 1 auto;
    padding: 10px 12px;
    border: 2px solid var(--color-black);
    border-radius: 10px;
    background: var(--color-cream);
    color: var(--color-black);
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 1px 2px rgba(17,17,17,0.06), 0 2px 6px rgba(17,17,17,0.08);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  .name-btn:active {
    transform: scale(0.97);
    box-shadow: 0 1px 1px rgba(17,17,17,0.06);
  }

  .name-btn.selected {
    background: var(--color-blue);
    border-color: var(--color-blue);
    color: #fff;
  }

  .gate-submit {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--color-black);
    color: var(--color-cream);
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(17,17,17,0.06), 0 2px 6px rgba(17,17,17,0.08);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  .gate-submit:active {
    transform: scale(0.97);
    box-shadow: 0 1px 1px rgba(17,17,17,0.06);
  }

  .gate-error {
    margin-top: 12px;
    color: var(--color-orange-text);
    font-weight: bold;
    min-height: 1.2em;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

  <div id="gate" class="gate-overlay">
    <div class="gate-box">
      <div class="title-box"><h1>Bingo des Amis</h1></div>
      <p class="gate-notice">Ce n'est pas une vraie sécurité, juste pour éviter les curieux.</p>
      <label for="passInput">Mot de passe</label>
      <input id="passInput" type="password" autocomplete="off" />
      <p class="gate-subtitle">Qui es-tu ?</p>
      <div class="gate-names">
        <button type="button" class="name-btn" data-name="Quentin">Quentin</button>
        <button type="button" class="name-btn" data-name="Joséphine">Joséphine</button>
        <button type="button" class="name-btn" data-name="Himanshu">Himanshu</button>
      </div>
      <button type="button" id="gateSubmit" class="gate-submit">Entrer</button>
      <p id="gateError" class="gate-error" role="alert"></p>
    </div>
  </div>

  <div class="page">
    <header class="app-header">
      <div class="title-box"><h1>Bingo des Amis</h1></div>
      <div class="header-progress">
        <p id="progress">Chargement…</p>
        <div id="ownerProgress" class="owner-progress">
          <span class="owner-badge" data-owner="Quentin">Quentin <strong id="prog-Quentin">0</strong>/15</span>
          <span class="owner-badge" data-owner="Joséphine">Joséphine <strong id="prog-Joséphine">0</strong>/15</span>
          <span class="owner-badge" data-owner="Himanshu">Himanshu <strong id="prog-Himanshu">0</strong>/15</span>
        </div>
      </div>
    </header>
    <div id="errorBanner" class="error-banner" role="alert" hidden>Connexion Supabase indisponible</div>
    <div id="board" class="board" role="group" aria-label="Grille de bingo 7 par 7"></div>

    <section id="ownerLists" class="owner-lists" aria-label="Listes de tâches par personne">
      <div class="owner-list" data-owner="Quentin">
        <div class="owner-list-header">
          <span class="owner-list-name">Quentin</span>
          <div class="owner-list-bar-track"><div class="owner-list-bar-fill" id="bar-Quentin"></div></div>
          <span class="owner-list-pct" id="pct-Quentin">0%</span>
        </div>
        <ul class="owner-list-items" id="list-Quentin"></ul>
      </div>
      <div class="owner-list" data-owner="Joséphine">
        <div class="owner-list-header">
          <span class="owner-list-name">Joséphine</span>
          <div class="owner-list-bar-track"><div class="owner-list-bar-fill" id="bar-Joséphine"></div></div>
          <span class="owner-list-pct" id="pct-Joséphine">0%</span>
        </div>
        <ul class="owner-list-items" id="list-Joséphine"></ul>
      </div>
      <div class="owner-list" data-owner="Himanshu">
        <div class="owner-list-header">
          <span class="owner-list-name">Himanshu</span>
          <div class="owner-list-bar-track"><div class="owner-list-bar-fill" id="bar-Himanshu"></div></div>
          <span class="owner-list-pct" id="pct-Himanshu">0%</span>
        </div>
        <ul class="owner-list-items" id="list-Himanshu"></ul>
      </div>
    </section>
  </div>

  <div id="celebration"></div>
  <div id="status" class="sr-only" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/twemoji@14/dist/twemoji.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@11/dist/motion.js"></script>
  <script>
  (function () {
    'use strict';

    var CREDS = {
      url: 'https://nbegfjsrxfwcuizbhyog.supabase.co',
      anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5iZWdmanNyeGZ3Y3VpemJoeW9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NzIzNTUsImV4cCI6MjEwMzI0ODM1NX0.ulU77am1xyQPcfjtZIfyXvkC75sHbDsSqvhLaV3R96k'
    };
    var LS = { pass: 'bingo_amis_pass_ok', name: 'bingo_amis_name' };
    var VALID_NAMES = ['Quentin', 'Joséphine', 'Himanshu'];
    var PASSPHRASE = 'amis2026';
    var OWNER_COLORS = {
      'Quentin': 'var(--color-blue)',
      'Joséphine': 'var(--color-orange-fill)',
      'Himanshu': 'var(--color-black)'
    };
    var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var state = new Map();
    var celebrated = new Set();
    var currentName = null;
    var selectedName = null;
    var sb = null;

    var gateEl = document.getElementById('gate');
    var gateError = document.getElementById('gateError');
    var passInput = document.getElementById('passInput');
    var nameButtons = document.querySelectorAll('.name-btn');
    var gateSubmit = document.getElementById('gateSubmit');
    var boardEl = document.getElementById('board');
    var progressEl = document.getElementById('progress');
    var statusEl = document.getElementById('status');
    var celebrationEl = document.getElementById('celebration');
    var bannerEl = document.getElementById('errorBanner');

    nameButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        selectedName = btn.dataset.name;
        nameButtons.forEach(function (b) { b.classList.toggle('selected', b === btn); });
      });
    });

    gateSubmit.addEventListener('click', attemptGate);
    passInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') attemptGate();
    });

    function attemptGate() {
      if (!selectedName || VALID_NAMES.indexOf(selectedName) === -1) {
        gateError.textContent = 'Choisis ton prénom.';
        return;
      }
      if (passInput.value.trim() !== PASSPHRASE) {
        gateError.textContent = 'Mot de passe incorrect.';
        return;
      }
      localStorage.setItem(LS.pass, 'ok');
      localStorage.setItem(LS.name, selectedName);
      gateError.textContent = '';
      currentName = selectedName;
      gateEl.style.display = 'none';
      boot();
    }

    function checkGate() {
      var passOk = localStorage.getItem(LS.pass) === 'ok';
      var savedName = localStorage.getItem(LS.name);
      if (passOk && VALID_NAMES.indexOf(savedName) !== -1) {
        currentName = savedName;
        gateEl.style.display = 'none';
        boot();
      }
    }

    function boot() {
      sb = window.supabase.createClient(CREDS.url, CREDS.anonKey);
      buildEmptyGrid();
      loadBoard();
      subscribeRealtime();
    }

    function buildEmptyGrid() {
      boardEl.innerHTML = '';
      for (var id = 1; id <= 49; id++) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cell';
        btn.dataset.id = String(id);
        (function (cellId) {
          btn.addEventListener('click', function () { toggle(cellId); });
        })(id);
        boardEl.appendChild(btn);
      }
    }

    function loadBoard() {
      sb.from('bingo_squares').select('*').order('id').then(function (res) {
        if (res.error) { renderFallback(); return; }
        state = new Map(res.data.map(function (row) { return [row.id, row]; }));
        renderAll();
        checkLines({ silent: true });
        updateProgress();
        updateOwnerProgress();
        renderOwnerLists();
        hideErrorBanner();
      }).catch(function () {
        renderFallback();
      });
    }

    function renderFallback() {
      showErrorBanner();
      for (var id = 1; id <= 49; id++) {
        var btn = boardEl.querySelector('[data-id="' + id + '"]');
        if (!btn) continue;
        btn.className = 'cell fallback';
        btn.disabled = true;
        btn.textContent = '—';
        btn.setAttribute('aria-label', 'Case indisponible');
      }
    }

    function showErrorBanner() { bannerEl.hidden = false; }
    function hideErrorBanner() { bannerEl.hidden = true; }

    function renderAll() {
      state.forEach(function (row, id) { renderCell(id, { skipTwemoji: true }); });
      if (window.twemoji) window.twemoji.parse(boardEl);
    }

    function renderCell(id, opts) {
      opts = opts || {};
      var row = state.get(id);
      if (!row) return;
      var btn = boardEl.querySelector('[data-id="' + id + '"]');
      if (!btn) return;

      var isFree = !!row.is_free;
      var completed = !!row.completed;

      btn.className = 'cell' + (completed ? ' completed' : '') + (isFree ? ' free' : '');
      btn.disabled = false;
      btn.setAttribute('aria-disabled', isFree ? 'true' : 'false');
      btn.setAttribute('aria-pressed', completed ? 'true' : 'false');

      var ownerPart = row.owner ? ('Propriétaire : ' + row.owner + '. ') : '';
      var statePart = completed
        ? ('Complété' + (row.completed_by ? (' par ' + row.completed_by) : '') + '.')
        : 'Non complété.';
      btn.setAttribute('aria-label', (row.label || '') + '. ' + ownerPart + statePart);
      btn.title = row.label || '';

      var emojiChar = escapeHtml(row.emoji || '');
      var dotHtml = '';
      if (!isFree && row.owner) {
        var initial = row.owner.charAt(0).toUpperCase();
        var color = Object.prototype.hasOwnProperty.call(OWNER_COLORS, row.owner)
          ? OWNER_COLORS[row.owner]
          : 'var(--color-black)';
        var orangeClass = row.owner === 'Joséphine' ? ' owner-orange' : '';
        dotHtml = '<span class="owner-dot' + orangeClass + '" style="background:' + color + '" aria-hidden="true">' + escapeHtml(initial) + '</span>';
      }

      var xMarkHtml = (!isFree && completed)
        ? '<span class="x-mark" aria-hidden="true"><span class="x-bar x-bar-1"></span><span class="x-bar x-bar-2"></span></span>'
        : '';

      btn.innerHTML =
        '<span class="cell-emoji">' + emojiChar + '</span>' +
        '<span class="cell-label">' + escapeHtml(row.label || '') + '</span>' +
        dotHtml +
        xMarkHtml;

      if (!opts.skipTwemoji && window.twemoji) window.twemoji.parse(btn);
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggle(id) {
      var row = state.get(id);
      if (!row || row.is_free) return;

      var prevSnapshot = Object.assign({}, row);
      var nextCompleted = !row.completed;

      row.completed = nextCompleted;
      row.completed_by = nextCompleted ? currentName : null;
      row.completed_at = nextCompleted ? new Date().toISOString() : null;
      state.set(id, row);

      var btn = boardEl.querySelector('[data-id="' + id + '"]');
      flipCell(btn, id);

      announce((row.label || 'Case') + (nextCompleted
        ? (' cochée par ' + currentName + '.')
        : ' décochée.'));

      checkLines({ silent: false });
      updateProgress();
      updateOwnerProgress();
      renderOwnerLists();

      sb.from('bingo_squares')
        .update({
          completed: nextCompleted,
          completed_by: nextCompleted ? currentName : null,
          completed_at: nextCompleted ? new Date().toISOString() : null
        })
        .eq('id', id)
        .select()
        .then(function (res) {
          if (res.error || !res.data || res.data.length !== 1) {
            state.set(id, prevSnapshot);
            renderCell(id);
            checkLines({ silent: true });
            updateProgress();
            updateOwnerProgress();
            renderOwnerLists();
            announce('Échec de la mise à jour, réessaie.');
          }
        })
        .catch(function () {
          state.set(id, prevSnapshot);
          renderCell(id);
          checkLines({ silent: true });
          updateProgress();
          updateOwnerProgress();
          renderOwnerLists();
          announce('Échec de la mise à jour, réessaie.');
        });
    }

    function flipCell(el, id) {
      if (!el || REDUCED || !(window.Motion && window.Motion.animate)) {
        renderCell(id);
        return;
      }
      window.Motion.animate(el, { rotateY: [0, 90] }, { duration: 0.15, ease: 'easeIn' })
        .finished.then(function () {
          renderCell(id);
          return window.Motion.animate(el, { rotateY: [90, 0] }, { duration: 0.15, ease: 'easeOut' }).finished;
        })
        .catch(function () {
          renderCell(id);
        });
    }

    function updateProgress() {
      var done = 0;
      var total = 0;
      state.forEach(function (row) {
        if (!row.is_free) {
          total++;
          if (row.completed) done++;
        }
      });
      progressEl.textContent = done + ' / ' + total + ' complétées';
    }

    function updateOwnerProgress() {
      var counts = { Quentin: 0, 'Joséphine': 0, Himanshu: 0 };
      state.forEach(function (row) {
        if (!row.is_free && row.completed && counts.hasOwnProperty(row.owner)) counts[row.owner]++;
      });
      Object.keys(counts).forEach(function (owner) {
        var el = document.getElementById('prog-' + owner);
        if (el) el.textContent = String(counts[owner]);
      });
    }

    function renderOwnerLists() {
      var owners = ['Quentin', 'Joséphine', 'Himanshu'];
      owners.forEach(function (owner) {
        var rows = [];
        state.forEach(function (row) {
          if (!row.is_free && row.owner === owner) rows.push(row);
        });

        var done = rows.filter(function (r) { return r.completed; }).length;
        var total = rows.length;
        var pct = total ? Math.round((done / total) * 100) : 0;

        var barEl = document.getElementById('bar-' + owner);
        if (barEl) barEl.style.width = pct + '%';
        var pctEl = document.getElementById('pct-' + owner);
        if (pctEl) pctEl.textContent = pct + '%';

        rows.sort(function (a, b) {
          if (!!a.completed !== !!b.completed) return a.completed ? 1 : -1;
          return a.id - b.id;
        });

        var listEl = document.getElementById('list-' + owner);
        if (!listEl) return;
        listEl.innerHTML = '';
        rows.forEach(function (row) {
          var li = document.createElement('li');
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'owner-task-btn' + (row.completed ? ' completed' : '');
          btn.textContent = row.label || '';
          var stateText = row.completed
            ? ('Complété' + (row.completed_by ? (' par ' + row.completed_by) : '') + '.')
            : 'Non complété.';
          btn.setAttribute('aria-pressed', row.completed ? 'true' : 'false');
          btn.setAttribute('aria-label', (row.label || '') + '. ' + stateText);
          btn.addEventListener('click', (function (taskId) {
            return function () { toggle(taskId); };
          })(row.id));
          li.appendChild(btn);
          listEl.appendChild(li);
        });
      });
    }

    function checkLines(opts) {
      var silent = opts.silent;
      var r, c, ids;
      for (r = 0; r < 7; r++) {
        ids = [];
        for (c = 0; c < 7; c++) ids.push(r * 7 + c + 1);
        evalLine('row-' + r, ids, silent);
      }
      for (c = 0; c < 7; c++) {
        ids = [];
        for (r = 0; r < 7; r++) ids.push(r * 7 + c + 1);
        evalLine('col-' + c, ids, silent);
      }
    }

    function evalLine(key, ids, silent) {
      var complete = ids.every(function (id) {
        var row = state.get(id);
        return row && (row.completed || row.is_free);
      });
      if (complete && !celebrated.has(key)) {
        celebrated.add(key);
        if (!silent) celebrate(key);
      } else if (!complete && celebrated.has(key)) {
        celebrated.delete(key);
      }
    }

    function celebrate(key) {
      var parts = key.split('-');
      var kind = parts[0];
      var idx = parseInt(parts[1], 10) + 1;
      var message = (kind === 'row' ? ('Ligne ' + idx) : ('Colonne ' + idx)) + ' complétée !';
      announce(message);

      if (REDUCED) {
        var banner = document.createElement('div');
        banner.className = 'celebration-banner';
        banner.textContent = message;
        celebrationEl.appendChild(banner);
        if (window.Motion && window.Motion.animate) {
          window.Motion.animate(banner, { opacity: [0, 1, 0] }, { duration: 1.2, ease: 'easeInOut' })
            .finished.then(function () { banner.remove(); });
        } else {
          setTimeout(function () { banner.remove(); }, 1200);
        }
        return;
      }

      spawnConfettiRain();
      spawnFireworks();
    }

    var CELEBRATION_COLORS = [
      'var(--color-blue)',
      'var(--color-orange-fill)',
      'var(--color-black)',
      '#7C3AED',
      '#FBBF24',
      '#EC4899'
    ];

    function spawnConfettiRain() {
      var count = 140;
      for (var i = 0; i < count; i++) {
        (function (idx) {
          var piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.background = CELEBRATION_COLORS[idx % CELEBRATION_COLORS.length];
          piece.style.left = (Math.random() * 100) + '%';
          piece.style.top = (Math.random() * 30) + '%';
          celebrationEl.appendChild(piece);

          var dx = (Math.random() - 0.5) * 360;
          var dy = 180 + Math.random() * 320;
          var rot = (Math.random() - 0.5) * 900;
          var delay = Math.random() * 0.3;

          if (window.Motion && window.Motion.animate) {
            window.Motion.animate(
              piece,
              {
                x: [0, dx],
                y: [0, dy],
                rotate: [0, rot],
                scale: [1, 0.5],
                opacity: [1, 0]
              },
              { duration: 1.4, delay: delay, ease: 'easeOut' }
            ).finished.then(function () { piece.remove(); }).catch(function () { piece.remove(); });
          } else {
            setTimeout(function () { piece.remove(); }, 1700);
          }
        })(i);
      }
    }

    function spawnFireworks() {
      var burstCount = 5;
      var particlesPerBurst = 18;
      for (var b = 0; b < burstCount; b++) {
        var cx = 15 + Math.random() * 70;
        var cy = 15 + Math.random() * 40;
        var burstDelay = Math.random() * 0.5;
        for (var p = 0; p < particlesPerBurst; p++) {
          (function (pIdx) {
            var particle = document.createElement('div');
            particle.className = 'confetti-piece firework-particle';
            particle.style.background = CELEBRATION_COLORS[pIdx % CELEBRATION_COLORS.length];
            particle.style.left = cx + '%';
            particle.style.top = cy + '%';
            celebrationEl.appendChild(particle);

            var angle = (pIdx / particlesPerBurst) * Math.PI * 2 + Math.random() * 0.3;
            var radius = 60 + Math.random() * 90;
            var fx = Math.cos(angle) * radius;
            var fy = Math.sin(angle) * radius;

            if (window.Motion && window.Motion.animate) {
              window.Motion.animate(
                particle,
                { x: [0, fx], y: [0, fy], scale: [1, 0.3], opacity: [1, 0] },
                { duration: 0.9, delay: burstDelay, ease: 'easeOut' }
              ).finished.then(function () { particle.remove(); }).catch(function () { particle.remove(); });
            } else {
              setTimeout(function () { particle.remove(); }, 1500);
            }
          })(p);
        }
      }
    }

    function announce(msg) {
      statusEl.textContent = msg;
    }

    function subscribeRealtime() {
      sb.channel('bingo')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bingo_squares' }, function (payload) {
          var updated = payload.new;
          if (!updated || !updated.id) return;
          state.set(updated.id, updated);
          renderCell(updated.id);
          announce((updated.label || 'Case') + (updated.completed
            ? (' cochée par ' + (updated.completed_by || 'quelqu\'un') + '.')
            : ' décochée.'));
          checkLines({ silent: false });
          updateProgress();
          updateOwnerProgress();
          renderOwnerLists();
        })
        .subscribe(function (status) {
          if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            showErrorBanner();
          } else if (status === 'SUBSCRIBED') {
            hideErrorBanner();
            loadBoard();
          }
        });
    }

    checkGate();
  })();
  </script>
</body>
